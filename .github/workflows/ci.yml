name: GeminiHub Enterprise CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build --workspace=@geminihub/shared

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Typecheck Backend (Clean Architecture)
        run: npx tsc --noEmit --project apps/api/tsconfig.json

      - name: Typecheck Frontend
        run: npx tsc --noEmit --project apps/web/tsconfig.json

      - name: Run Unit Tests (Vitest)
        run: npx vitest run apps/api/test
        env:
          NODE_ENV: test
          APP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          JWT_SECRET: test-jwt-secret-key-2026
          COOKIE_SECRET: test-cookie-secret-key-2026

      - name: Build Web Production Bundle
        run: npm run build --workspace=@geminihub/web
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

