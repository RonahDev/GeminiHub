services:
  postgres:
    image: postgres:16-alpine
    container_name: geminihub-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geminihub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geminihub_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-geminihub_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geminihub -d geminihub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: geminihub-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

